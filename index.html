<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ AI가 찾아주는 4~5세대 아이돌 최애 테스트</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="✨ AI가 추천하는 내 운명의 4~5세대 아이돌 최애">
    <meta property="og:description" content="실시간 AI 분석! 이전 최애 무드와 취향을 분석해 찰떡 4~5세대 최애를 추천해드려요!">
    <meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=AI+Idol+Test">

    <style>
        :root {
            --primary: #7c4dff;
            --primary-hover: #651fff;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: var(--card-bg); width: 100%; max-width: 480px; padding: 32px 24px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 12px; word-break: keep-all; }
        p { color: #6c757d; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5; }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        button { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button.secondary { background: #e9ecef; color: #495057; }
        button.secondary:hover { background: #dee2e6; }

        input[type="text"] { width: 100%; padding: 16px; border: 2px solid #e9ecef; border-radius: 14px; font-size: 1rem; outline: none; margin-bottom: 12px; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        .progress-bar { width: 100%; background: #e9ecef; height: 8px; border-radius: 4px; margin-bottom: 24px; overflow: hidden; }
        .progress { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }

        .hidden { display: none; }
        
        .result-card { background: linear-gradient(135deg, #f3e5f5, #e8eaf6); padding: 24px; border-radius: 18px; margin: 20px 0; border: 2px solid #d1c4e9; text-align: left; }
        .result-badge { display: inline-block; background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 8px; }
        .result-title { font-size: 1.6rem; color: #311b92; margin-bottom: 12px; font-weight: 700; text-align: center; }
        .result-desc { color: #4a148c; font-size: 0.95rem; line-height: 1.6; background: rgba(255,255,255,0.7); padding: 16px; border-radius: 12px; white-space: pre-wrap; }

        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 메인 화면 -->
    <div id="screen-start">
        <span style="font-size: 3rem;">🤖✨</span>
        <h1 style="margin-top: 10px;">AI 찰떡 4~5세대<br>내 운명의 최애 찾기</h1>
        <p>얼굴상부터 소통 스타일, 이전 최애 무드까지!<br>AI가 실시간 분석해서 찰떡 최애를 찾아드려요.</p>
        <div class="btn-group">
            <button onclick="selectCategory('여자')">🚺 여자 아이돌 최애 찾기</button>
            <button onclick="selectCategory('남자')">🚹 남자 아이돌 최애 찾기</button>
        </div>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="screen-quiz" class="hidden">
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        <h1 id="question-text">질문이 여기에 표시됩니다.</h1>
        <p id="question-sub">취향에 맞는 옵션을 선택하거나 입력해 주세요.</p>
        <div id="answers" class="btn-group"></div>
    </div>

    <!-- 3. AI 로딩 화면 -->
    <div id="screen-loading" class="hidden">
        <div class="spinner"></div>
        <h2>AI가 전 최애 무드 스캔 중... 🔍</h2>
        <p style="margin-top: 10px;">이전 최애와 당신의 취향을 조합해서<br>찰떡인 4~5세대 멤버를 찾고 있어요!</p>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="screen-result" class="hidden">
        <span>🎉</span>
        <h1>당신의 찰떡 4~5세대 최애는?</h1>
        <div class="result-card">
            <div style="text-align: center;"><span id="res-badge" class="result-badge">세대 / 그룹</span></div>
            <div id="res-name" class="result-title">아이돌 이름</div>
            <div id="res-desc" class="result-desc">AI 분석 결과가 출력됩니다.</div>
        </div>
        <div class="btn-group">
            <button onclick="copyLink()">🔗 테스트 링크 복사해서 공유하기</button>
            <button class="secondary" onclick="resetTest()">🔄 다시 테스트하기</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ 따옴표("") 안에 복사한 API Key를 직접 넣어주세요!
    const GEMINI_API_KEY = "AQ.Ab8RN6L2IpEkcRsb4dMD19_0bv9ZlrNJED8cjmj717fbBBhrCw";

    const questions = [
        {
            q: "1. 가장 좋아하는 비주얼/얼굴상은?",
            type: "choice",
            options: [
                "무심하고 차가운데 힙한 '강경 고양이상'",
                "웃을 때 사르르 녹는 순둥 '강경 강아지상'",
                "이목구비 자기주장 확실한 '아랍상 / 정석 조각상'",
                "말랑말랑 무해하고 하얀 '두부상 / 토끼상'",
                "매력적이고 비율 좋은 '공룡상 / 여우상'"
            ]
        },
        {
            q: "2. 선호하는 멤버 국적 취향은?",
            type: "choice",
            options: [
                "한국인 멤버만 품는다! (강경 한국인파)",
                "글로벌 무드 환영! (외국인 / 이중국적 / 일본·중국 등)",
                "국적은 상관없이 무드만 맞으면 됨!"
            ]
        },
        {
            q: "3. 이전 최애(전 최애)는 누구였어?",
            type: "text",
            placeholder: "예: 방탄소년단 정국, 세븐틴 호시, 아이브 장원영 등"
        },
        {
            q: "4. 가장 좋아하는 덕질 소통 스타일은?",
            type: "choice",
            options: [
                "버블/위버스에 셀카 폭탄 올리는 셀카 장인",
                "오늘 뭐 먹었는지까지 다 알려주는 'TMI 일상 공유형'",
                "말투에 애교가 기본 탑재된 '사랑꾼 애교형'",
                "라이브 켜서 찐친처럼 장난치고 티키타카 하는 '친구형'"
            ]
        }
    ];

    let currentCategory = '';
    let currentQ = 0;
    let selectedUserAnswers = [];

    function selectCategory(cat) {
        currentCategory = cat;
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-quiz').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const qData = questions[currentQ];
        document.getElementById('question-text').innerText = qData.q;
        
        const percent = ((currentQ + 1) / questions.length) * 100;
        document.getElementById('progress').style.width = percent + '%';

        const answersDiv = document.getElementById('answers');
        answersDiv.innerHTML = '';

        if (qData.type === "choice") {
            qData.options.forEach(optText => {
                const btn = document.createElement('button');
                btn.innerText = optText;
                btn.onclick = () => selectAnswer(optText);
                answersDiv.appendChild(btn);
            });
        } else if (qData.type === "text") {
            const input = document.createElement('input');
            input.type = "text";
            input.id = "prev-idol-input";
            input.placeholder = qData.placeholder;

            const nextBtn = document.createElement('button');
            nextBtn.innerText = "다음 질문으로 ➔";
            nextBtn.onclick = () => {
                const val = input.value.trim() || "특별히 없음";
                selectAnswer(val);
            };

            answersDiv.appendChild(input);
            answersDiv.appendChild(nextBtn);
        }
    }

    function selectAnswer(answerText) {
        selectedUserAnswers.push(`${questions[currentQ].q} => ${answerText}`);
        currentQ++;
        if (currentQ < questions.length) {
            showQuestion();
        } else {
            getAiRecommendation();
        }
    }

    async function getAiRecommendation() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-loading').classList.remove('hidden');

        const prompt = `
당신은 K-POP 4세대 및 5세대 아이돌 데이터와 덕질 문화에 정통한 전문가입니다.
사용자가 제출한 다음 취향 정보와 [이전 최애]를 분석하여, **반드시 4세대 또는 5세대 한국 K-POP ${currentCategory} 아이돌 멤버 1명**을 추천해 주세요.

[사용자 입력 정보]
- 추천 대상 카테고리: ${currentCategory} 아이돌
${selectedUserAnswers.join('\n')}

[추천 핵심 지침]
1. 사용자가 적은 '이전 최애'의 외모, 이미지, 분위기와 유사한 무드를 가진 4세대/5세대 ${currentCategory} 아이돌을 고려할 것.
2. 얼굴상, 국적 취향, 소통 스타일 조건에 최대한 부합할 것.
3. 설명문은 트렌디하고 친근한 톤(덕후 감성, "너랑 찰떡임!")으로 작성할 것.

반드시 아래 JSON 형식으로만 답변하고, 다른 텍스트나 마크다운(\`\`\`json)은 절대 넣지 마세요.

{
  "group": "세대 및 그룹명 (예: 5세대 · 보이넥스트도어)",
